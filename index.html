<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Т-Инвестиции</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                         "Segoe UI", Arial, sans-serif;
            background: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 28px;
            padding: 40px 25px 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,.08);
        }

        .icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 25px;
            border-radius: 22px;
            background: #ffdd2d;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #111;
            font-size: 34px;
            font-weight: 800;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 28px;
            color: #111;
        }

        .version {
            color: #777;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .install {
            display: block;
            width: 100%;
            padding: 17px;
            border-radius: 15px;
            background: #111;
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
        }

        .install:active {
            opacity: .8;
        }

        .info {
            margin-top: 25px;
            color: #888;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">Т</div>

    <h1>Т-Инвестиции</h1>

    <div class="version">
        Версия 1.3.1
    </div>

    <a class="install"
       href="itms-services://?action=download-manifest&url=https://bosskin-pro.github.io/tinkoffinvest-ipa/manifest.plist">
        Установить
    </a>

    <div class="info">
        Нажмите «Установить» и дождитесь окончания загрузки приложения.
    </div>

</div>

</body>
</html>
